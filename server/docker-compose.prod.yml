version: "3.8"
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ganesh594/social-connection-platform-server:latest
    env_file:
      - ./server/.env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "4000:4000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

